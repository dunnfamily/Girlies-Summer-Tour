<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>K-Pop Demon Hunter Adventure Tracker</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Fredoka', system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,43,214,.35), transparent 28%),
        radial-gradient(circle at 80% 18%, rgba(0,229,255,.32), transparent 25%),
        radial-gradient(circle at 50% 95%, rgba(124,60,255,.38), transparent 32%),
        linear-gradient(135deg, #130022 0%, #24004a 42%, #071b3d 100%);
      color: #f8fafc;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, select {
      font-family: inherit;
      font-size: 16px;
    }
    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .app {
      min-height: 100vh;
      padding: 18px 14px 105px;
      max-width: 520px;
      margin: 0 auto;
    }
    .header {
      background: rgba(20, 8, 45, .82);
      border: 2px solid rgba(255,43,214,.45);
      border-radius: 30px;
      padding: 18px;
      box-shadow: 0 14px 35px rgba(255,43,214,.22), 0 0 30px rgba(0,229,255,.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .eyebrow {
      color: #00e5ff;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 800;
      font-size: 13px;
      margin: 0 0 3px;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      margin: 0;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(255,43,214,.75);
      font-size: 34px;
      line-height: 1;
      font-weight: 900;
    }
    h2 {
      font-size: 30px;
      margin-bottom: 12px;
      font-weight: 900;
    }
    h3 {
      font-size: 21px;
      margin-bottom: 8px;
      font-weight: 900;
    }
    .sun { font-size: 54px; animation: wiggle 2.2s infinite ease-in-out; }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }
    .card {
      background: rgba(21, 13, 48, .88);
      border-radius: 28px;
      padding: 16px;
      box-shadow: 0 10px 28px rgba(0,0,0,.28), 0 0 22px rgba(255,43,214,.13);
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,.13);
      color: #f8fafc;
    }
    .kid-card {
      border: 3px solid var(--kid-color);
    }
    .avatar {
      font-size: 45px;
      margin-bottom: 4px;
    }
    .kid-name {
      color: var(--kid-color);
      font-size: 25px;
      font-weight: 900;
      margin: 0;
    }
    .points {
      font-size: 42px;
      font-weight: 900;
      margin: 5px 0 0;
    }
    .muted {
      color: #cbd5e1;
      font-weight: 800;
      font-size: 14px;
      margin: 0;
    }
    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 999px;
      background: var(--kid-soft);
      color: var(--kid-color);
      font-weight: 900;
      font-size: 13px;
    }
    .stat-card {
      color: white;
      min-height: 125px;
    }
    .orange { background: #f97316; }
    .blue { background: #0ea5e9; }
    .stat-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .stat-number {
      font-size: 43px;
      font-weight: 900;
      margin-bottom: 4px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .point-pill {
      background: #00e5ff;
      padding: 7px 10px;
      border-radius: 999px;
      font-weight: 900;
      white-space: nowrap;
    }
    .kid-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }
    .big-btn {
      color: white;
      border-radius: 18px;
      padding: 14px 10px;
      font-weight: 900;
      box-shadow: 0 8px 16px rgba(15,23,42,.16);
      transition: transform .08s ease;
    }
    .big-btn:active { transform: scale(.96); }
    .big-btn:disabled {
      background: #cbd5e1 !important;
      color: #64748b !important;
      box-shadow: none;
      cursor: default;
    }
    .selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
      background: rgba(21, 13, 48, .9);
      border-radius: 24px;
      padding: 8px;
      box-shadow: 0 8px 18px rgba(15,23,42,.1);
    }
    .selector button {
      border-radius: 18px;
      padding: 12px 8px;
      font-weight: 900;
    }
    .reward-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .reward-emoji { font-size: 30px; }
    .log-item {
      border-bottom: 1px solid #e2e8f0;
      padding: 9px 0;
      font-size: 14px;
      font-weight: 700;
    }
    .log-item:last-child { border-bottom: 0; }
    .progress-outer {
      height: 15px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-inner {
      height: 100%;
      background: linear-gradient(90deg, #ff2bd6, #00e5ff);
      border-radius: 999px;
      transition: width .25s ease;
    }
    .add-row {
      display: grid;
      grid-template-columns: 1fr 50px;
      gap: 8px;
    }
    .input, select {
      width: 100%;
      border: 0;
      border-radius: 17px;
      background: rgba(255,255,255,.12);
      color: #f8fafc;
      padding: 13px;
      font-weight: 800;
      min-width: 0;
    }
    .icon-btn {
      border-radius: 17px;
      background: linear-gradient(135deg, #00e5ff, #2563eb);
      color: white;
      font-size: 25px;
      font-weight: 900;
    }
    .bucket-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      background: rgba(21, 13, 48, .9);
      border-radius: 23px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 8px 18px rgba(15,23,42,.1);
      font-weight: 900;
      color: #f8fafc;
    }
    .bucket-icon { font-size: 25px; }
    .done {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .parent-btn {
      border-radius: 17px;
      background: #0f172a;
      color: white;
      padding: 13px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(15,23,42,.14);
      width: 100%;
    }
    .danger { background: #ef4444; }
    .tool { background: #f97316; }
    .mini-row {
      display: grid;
      grid-template-columns: 1fr 82px 45px;
      gap: 7px;
      margin-bottom: 10px;
    }
    .reward-row {
      display: grid;
      grid-template-columns: 52px 1fr 78px 45px;
      gap: 7px;
      margin-bottom: 10px;
    }
    .delete-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #e2e8f0;
      padding: 9px 0;
      font-weight: 800;
    }
    .trash {
      background: #fee2e2;
      color: #dc2626;
      border-radius: 12px;
      padding: 9px;
      font-size: 16px;
      flex-shrink: 0;
    }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      background: rgba(12, 5, 28, .96);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,43,214,.35);
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 24px rgba(15,23,42,.12);
    }
    .nav-inner {
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .nav-btn {
      background: transparent;
      border-radius: 18px;
      padding: 8px 2px;
      font-size: 11px;
      font-weight: 900;
      color: #cbd5e1;
    }
    .nav-btn.active {
      background: #00e5ff;
      color: #ea580c;
    }
    .nav-emoji {
      display: block;
      font-size: 22px;
      line-height: 1.1;
      margin-bottom: 2px;
    }
    .tip {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 88px;
      z-index: 25;
      max-width: 496px;
      margin: 0 auto;
      background: rgba(21, 13, 48, .96);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 10px 28px rgba(15,23,42,.18);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 13px;
    }
    .tip button {
      margin-left: auto;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      color: #f8fafc;
      padding: 7px 10px;
      font-weight: 900;
    }
    .burst-wrap {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .burst {
      color: white;
      border-radius: 999px;
      padding: 28px 34px;
      font-size: 60px;
      font-weight: 900;
      box-shadow: 0 20px 50px rgba(15,23,42,.28);
      animation: popBurst .75s ease-out forwards;
    }
    @keyframes popBurst {
      0% { opacity: 0; transform: scale(.45); }
      35% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(1.85); }
    }
    @keyframes wiggle {
      0%,100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
  </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const STORAGE_KEY = "sophia_mckenna_kpop_demon_hunter_tracker_v1";

const kids = [
  { id: "sophia", name: "Sophia", color: "#ff2bd6", soft: "#ffe4fb", avatar: "🎤" },
  { id: "mckenna", name: "McKenna", color: "#7c3cff", soft: "#efe7ff", avatar: "⚔️" }
];

const makeId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

const defaultChores = [
  ["Make Bed / Reset Base", 10],
  ["Clear the Dishes Portal", 15],
  ["Vacuum the Demon Dust", 20],
  ["Banish the Trash", 15],
  ["Laundry Armor Reset", 25],
  ["Patrol the Yard", 30],
  ["Cleanse the Mirror Realm", 25],
  ["Restore the Stage Room", 10]
].map(([name, points]) => ({ id: makeId(), name, points }));

const defaultRewards = [
  ["30 min Screen Time", 50, "📱"],
  ["Stay Up 30 Min Late", 75, "🌙"],
  ["Pick Dinner Before the Show", 100, "🍜"],
  ["Victory Sonic Run", 125, "🥤"],
  ["Treasure Cash $1", 150, "💎"],
  ["Backstage Sleepover", 200, "🎉"],
  ["Choose Movie Night", 80, "🎬"]
].map(([name, cost, emoji]) => ({ id: makeId(), name, cost, emoji }));

const defaultBucket = [
  "Moonlight Lake Quest",
  "Movie Night Mission",
  "Camp Under the Stars",
  "Backyard Flame Circle",
  "Water Orb Battle",
  "Creature Field Trip",
  "Neon Bike Patrol",
  "Make Victory Ice Cream",
  "Fishing Quest",
  "Mini Golf Boss Battle",
  "Slip-N-Slide Arena",
  "Drive-In Concert Movie",
  "Market Supply Run",
  "Fireworks Finale",
  "Family Game Tournament"
].map(name => ({ id: makeId(), name, done: false }));

const todayKey = () => new Date().toISOString().slice(0, 10);

const initialState = {
  points: { sophia: 0, mckenna: 0 },
  chores: defaultChores,
  rewards: defaultRewards,
  bucket: defaultBucket,
  completed: {},
  history: [],
  redemptions: [],
  pin: "1234",
  streak: { count: 0, lastActiveDate: null },
  tipDismissed: false
};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return initialState;
    return { ...initialState, ...JSON.parse(saved) };
  } catch {
    return initialState;
  }
}

function daysUntilAug31() {
  const now = new Date();
  let target = new Date(now.getFullYear(), 6, 27, 23, 59, 59);
  if (now > target) target = new Date(now.getFullYear() + 1, 7, 31, 23, 59, 59);
  return Math.max(0, Math.ceil((target - now) / 86400000));
}

function isYesterday(dateString) {
  if (!dateString) return false;
  const d = new Date(dateString + "T12:00:00");
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10) === todayKey();
}

function App() {
  const [state, setState] = React.useState(loadState);
  const [tab, setTab] = React.useState("home");
  const [selectedKid, setSelectedKid] = React.useState(kids[0].id);
  const [burst, setBurst] = React.useState(null);
  const [portalOpen, setPortalOpen] = React.useState(false);
  const [pinEntry, setPinEntry] = React.useState("");
  const [newBucket, setNewBucket] = React.useState("");
  const [newChore, setNewChore] = React.useState({ name: "", points: 10 });
  const [newReward, setNewReward] = React.useState({ emoji: "🎁", name: "", cost: 50 });
  const [adjust, setAdjust] = React.useState({ kid: kids[0].id, amount: "", reason: "" });
  const [newPin, setNewPin] = React.useState("");

  React.useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }, [state]);

  const today = todayKey();
  const completedToday = state.completed[today] || {};

  function kidById(id) {
    return kids.find(k => k.id === id) || kids[0];
  }

  function flash(text, color) {
    setBurst({ text, color, key: Date.now() });
    setTimeout(() => setBurst(null), 750);
  }

  function updateStreak(s) {
    if (s.streak.lastActiveDate === today) return s.streak;
    const count = isYesterday(s.streak.lastActiveDate) ? s.streak.count + 1 : 1;
    return { count, lastActiveDate: today };
  }

  function completeChore(chore, kidId) {
    if (completedToday[chore.id]?.[kidId]) return;
    const kid = kidById(kidId);
    flash("+" + chore.points, kid.color);

    setState(s => {
      const day = s.completed[today] || {};
      const entry = day[chore.id] || {};
      return {
        ...s,
        points: { ...s.points, [kidId]: s.points[kidId] + chore.points },
        completed: {
          ...s.completed,
          [today]: {
            ...day,
            [chore.id]: { ...entry, [kidId]: true }
          }
        },
        streak: updateStreak(s),
        history: [{
          id: makeId(),
          kidId,
          amount: chore.points,
          type: "chore",
          reason: "Completed chore: " + chore.name,
          date: new Date().toLocaleString()
        }, ...s.history]
      };
    });
  }

  function redeemReward(reward) {
    if (state.points[selectedKid] < reward.cost) return;
    const kid = kidById(selectedKid);
    flash("🎉", kid.color);

    setState(s => ({
      ...s,
      points: { ...s.points, [selectedKid]: s.points[selectedKid] - reward.cost },
      redemptions: [{
        id: makeId(),
        kidId: selectedKid,
        kidName: kid.name,
        reward: reward.name,
        date: new Date().toLocaleString()
      }, ...s.redemptions].slice(0, 10),
      history: [{
        id: makeId(),
        kidId: selectedKid,
        amount: -reward.cost,
        type: "reward",
        reason: "Redeemed reward: " + reward.name,
        date: new Date().toLocaleString()
      }, ...s.history]
    }));
  }

  function resetToday() {
    setState(s => {
      const completed = { ...s.completed };
      delete completed[today];
      return { ...s, completed };
    });
  }

  function addBucketItem() {
    const name = newBucket.trim();
    if (!name) return;
    setState(s => ({ ...s, bucket: [...s.bucket, { id: makeId(), name, done: false }] }));
    setNewBucket("");
  }

  function addChore() {
    const name = newChore.name.trim();
    if (!name) return;
    setState(s => ({
      ...s,
      chores: [...s.chores, { id: makeId(), name, points: Number(newChore.points) || 0 }]
    }));
    setNewChore({ name: "", points: 10 });
  }

  function addReward() {
    const name = newReward.name.trim();
    if (!name) return;
    setState(s => ({
      ...s,
      rewards: [...s.rewards, {
        id: makeId(),
        name,
        cost: Number(newReward.cost) || 0,
        emoji: newReward.emoji || "🎁"
      }]
    }));
    setNewReward({ emoji: "🎁", name: "", cost: 50 });
  }

  function applyAdjustment() {
    const amount = Number(adjust.amount);
    if (!amount) return;
    const kidId = adjust.kid;
    setState(s => ({
      ...s,
      points: { ...s.points, [kidId]: Math.max(0, s.points[kidId] + amount) },
      history: [{
        id: makeId(),
        kidId,
        amount,
        type: "manual",
        reason: adjust.reason || "Manual adjustment",
        date: new Date().toLocaleString()
      }, ...s.history]
    }));
    setAdjust({ ...adjust, amount: "", reason: "" });
  }

  const choresDoneByKid = {};
  kids.forEach(kid => {
    choresDoneByKid[kid.id] = Object.values(completedToday).filter(entry => entry?.[kid.id]).length;
  });

  const bucketDone = state.bucket.filter(item => item.done).length;
  const bucketPercent = state.bucket.length ? Math.round((bucketDone / state.bucket.length) * 100) : 0;

  return (
    <>
      <div className="app">
        <header className="header">
          <div>
            <p className="eyebrow">Hunter Era 2026</p>
            <h1>Demon Hunter Tracker</h1>
          </div>
          <div className="sun">🌙🎤</div>
        </header>

        {burst && (
          <div className="burst-wrap">
            <div className="burst" style={{ background: burst.color }}>{burst.text}</div>
          </div>
        )}

        {tab === "home" && (
          <section>
            <div className="grid2">
              {kids.map(kid => (
                <div
                  key={kid.id}
                  className="card kid-card"
                  style={{ "--kid-color": kid.color, "--kid-soft": kid.soft }}
                >
                  <div className="avatar">{kid.avatar}</div>
                  <p className="kid-name">{kid.name}</p>
                  <p className="points">{state.points[kid.id]}</p>
                  <p className="muted">XP Points</p>
                  <div className="badge">{choresDoneByKid[kid.id]} chores today</div>
                </div>
              ))}
            </div>

            <div className="grid2">
              <div className="card stat-card orange">
                <div className="stat-icon">🔥</div>
                <div className="stat-number">{state.streak.count}</div>
                <p style={{fontWeight: 900, margin: 0}}>Day Hunter Streak</p>
              </div>
              <div className="card stat-card blue">
                <div className="stat-icon">📅</div>
                <div className="stat-number">{daysUntilAug31()}</div>
                <p style={{fontWeight: 900, margin: 0}}>Days until Finale</p>
              </div>
            </div>
          </section>
        )}

        {tab === "chores" && (
          <section>
            <h2 style={{color:"#0369a1"}}>Training Missions ⚔️</h2>
            {state.chores.map(chore => (
              <div key={chore.id} className="card">
                <div className="row">
                  <h3 style={{margin:0}}>{chore.name}</h3>
                  <span className="point-pill">{chore.points} pts</span>
                </div>
                <div className="kid-buttons">
                  {kids.map(kid => {
                    const done = !!completedToday[chore.id]?.[kid.id];
                    return (
                      <button
                        key={kid.id}
                        className="big-btn"
                        disabled={done}
                        onClick={() => completeChore(chore, kid.id)}
                        style={{ background: kid.color }}
                      >
                        {done ? "Done!" : kid.name}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </section>
        )}

        {tab === "store" && (
          <section>
            <h2 style={{color:"#ea580c"}}>Backstage Rewards 🎁</h2>

            <div className="selector">
              {kids.map(kid => (
                <button
                  key={kid.id}
                  onClick={() => setSelectedKid(kid.id)}
                  style={{
                    background: selectedKid === kid.id ? kid.color : kid.soft,
                    color: selectedKid === kid.id ? "white" : kid.color
                  }}
                >
                  {kid.avatar} {kid.name}
                </button>
              ))}
            </div>

            {state.rewards.map(reward => {
              const afford = state.points[selectedKid] >= reward.cost;
              return (
                <div key={reward.id} className="card reward-card">
                  <div>
                    <h3 style={{marginBottom:4}}>
                      <span className="reward-emoji">{reward.emoji}</span> {reward.name}
                    </h3>
                    <p className="muted">{reward.cost} points</p>
                  </div>
                  <button
                    className="big-btn"
                    disabled={!afford}
                    onClick={() => redeemReward(reward)}
                    style={{ background: kidById(selectedKid).color }}
                  >
                    Redeem
                  </button>
                </div>
              );
            })}

            <div className="card">
              <h3>Recent Redemptions</h3>
              {state.redemptions.length === 0 ? (
                <p className="muted">No rewards redeemed yet.</p>
              ) : state.redemptions.map(r => (
                <div className="log-item" key={r.id}>
                  {r.kidName} redeemed {r.reward}<br />
                  <span className="muted">{r.date}</span>
                </div>
              ))}
            </div>
          </section>
        )}

        {tab === "bucket" && (
          <section>
            <h2 style={{color:"#0369a1"}}>Quest List 🗺️</h2>

            <div className="card">
              <div className="row" style={{fontWeight:900}}>
                <span>{bucketDone} of {state.bucket.length} Adventures Done! 🌟</span>
                <span>{bucketPercent}%</span>
              </div>
              <div className="progress-outer">
                <div className="progress-inner" style={{width: bucketPercent + "%"}} />
              </div>
            </div>

            <div className="card add-row">
              <input
                className="input"
                value={newBucket}
                onChange={e => setNewBucket(e.target.value)}
                placeholder="Add adventure..."
              />
              <button className="icon-btn" onClick={addBucketItem}>+</button>
            </div>

            {state.bucket.map(item => (
              <button
                className="bucket-item"
                key={item.id}
                onClick={() => setState(s => ({
                  ...s,
                  bucket: s.bucket.map(b => b.id === item.id ? { ...b, done: !b.done } : b)
                }))}
              >
                <span className="bucket-icon">{item.done ? "✅" : "⭐"}</span>
                <span className={item.done ? "done" : ""}>{item.done ? "🎉 " : ""}{item.name}</span>
              </button>
            ))}
          </section>
        )}

        {tab === "parent" && (
          <section>
            <h2 style={{color:"#334155"}}>Parent Portal 🔒</h2>

            {!portalOpen ? (
              <div className="card">
                <input
                  className="input"
                  inputMode="numeric"
                  placeholder="Enter 4-digit PIN"
                  value={pinEntry}
                  onChange={e => setPinEntry(e.target.value.replace(/\D/g, "").slice(0, 4))}
                  style={{textAlign:"center", fontSize:24, letterSpacing:5, marginBottom:10}}
                />
                <button
                  className="parent-btn"
                  onClick={() => {
                    if (pinEntry === state.pin) setPortalOpen(true);
                    setPinEntry("");
                  }}
                >
                  Unlock
                </button>
                <p className="muted" style={{textAlign:"center", marginTop:10}}>Default PIN: 1234</p>
              </div>
            ) : (
              <>
                <button className="parent-btn danger" style={{marginBottom:12}} onClick={() => setPortalOpen(false)}>
                  Lock Portal
                </button>

                <div className="card">
                  <h3>Adjust Points</h3>
                  <select value={adjust.kid} onChange={e => setAdjust({ ...adjust, kid: e.target.value })} style={{marginBottom:8}}>
                    {kids.map(k => <option key={k.id} value={k.id}>{k.name}</option>)}
                  </select>
                  <input
                    className="input"
                    type="number"
                    value={adjust.amount}
                    onChange={e => setAdjust({ ...adjust, amount: e.target.value })}
                    placeholder="Amount, negative allowed"
                    style={{marginBottom:8}}
                  />
                  <input
                    className="input"
                    value={adjust.reason}
                    onChange={e => setAdjust({ ...adjust, reason: e.target.value })}
                    placeholder="Reason"
                    style={{marginBottom:8}}
                  />
                  <button className="parent-btn" onClick={applyAdjustment}>Apply Adjustment</button>
                </div>

                <div className="card">
                  <h3>Manage Chores</h3>
                  <div className="mini-row">
                    <input className="input" value={newChore.name} onChange={e => setNewChore({...newChore, name:e.target.value})} placeholder="Chore" />
                    <input className="input" type="number" value={newChore.points} onChange={e => setNewChore({...newChore, points:e.target.value})} />
                    <button className="icon-btn" onClick={addChore}>+</button>
                  </div>
                  {state.chores.map(chore => (
                    <div className="delete-row" key={chore.id}>
                      <span>{chore.name} ({chore.points})</span>
                      <button className="trash" onClick={() => setState(s => ({...s, chores: s.chores.filter(c => c.id !== chore.id)}))}>🗑️</button>
                    </div>
                  ))}
                </div>

                <div className="card">
                  <h3>Manage Rewards</h3>
                  <div className="reward-row">
                    <input className="input" value={newReward.emoji} onChange={e => setNewReward({...newReward, emoji:e.target.value})} />
                    <input className="input" value={newReward.name} onChange={e => setNewReward({...newReward, name:e.target.value})} placeholder="Reward" />
                    <input className="input" type="number" value={newReward.cost} onChange={e => setNewReward({...newReward, cost:e.target.value})} />
                    <button className="icon-btn" onClick={addReward}>+</button>
                  </div>
                  {state.rewards.map(reward => (
                    <div className="delete-row" key={reward.id}>
                      <span>{reward.emoji} {reward.name} ({reward.cost})</span>
                      <button className="trash" onClick={() => setState(s => ({...s, rewards: s.rewards.filter(r => r.id !== reward.id)}))}>🗑️</button>
                    </div>
                  ))}
                </div>

                <div className="card">
                  <h3>Tools</h3>
                  <button className="parent-btn tool" onClick={resetToday} style={{marginBottom:8}}>Reset Today’s Chores</button>
                  <div className="add-row">
                    <input
                      className="input"
                      value={newPin}
                      onChange={e => setNewPin(e.target.value.replace(/\D/g, "").slice(0, 4))}
                      placeholder="New 4-digit PIN"
                    />
                    <button
                      className="parent-btn"
                      onClick={() => {
                        if (newPin.length === 4) {
                          setState(s => ({ ...s, pin: newPin }));
                          setNewPin("");
                        }
                      }}
                    >
                      Save
                    </button>
                  </div>
                </div>

                <div className="card">
                  <h3>Point History</h3>
                  {state.history.length === 0 ? (
                    <p className="muted">No point history yet.</p>
                  ) : state.history.map(h => (
                    <div className="log-item" key={h.id}>
                      <b>{kidById(h.kidId).name}</b>: {h.amount > 0 ? "+" : ""}{h.amount} — {h.reason}<br />
                      <span className="muted">{h.date}</span>
                    </div>
                  ))}
                </div>
              </>
            )}
          </section>
        )}
      </div>

      {!state.tipDismissed && (
        <div className="tip">
          <span>✨</span>
          <span>Tip: Add this to your iPhone Home Screen for a secret hunter-app feel.</span>
          <button onClick={() => setState(s => ({ ...s, tipDismissed: true }))}>×</button>
        </div>
      )}

      <nav className="bottom-nav">
        <div className="nav-inner">
          {[
            ["home", "🏠", "Home"],
            ["chores", "⚔️", "Missions"],
            ["store", "🎁", "Rewards"],
            ["bucket", "🌙", "Quests"],
            ["parent", "🔒", "Parent"]
          ].map(([id, emoji, label]) => (
            <button
              key={id}
              className={"nav-btn " + (tab === id ? "active" : "")}
              onClick={() => setTab(id)}
            >
              <span className="nav-emoji">{emoji}</span>
              {label}
            </button>
          ))}
        </div>
      </nav>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
